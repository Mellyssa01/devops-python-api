name: CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Teste, Build e Publicação no ECR
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências e rodar testes
        run: |
          python -m pip install --requirement requirements-dev.txt
          pytest

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Altere se sua região AWS for diferente

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir e enviar imagem para o ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: devops-python-api # Altere para o nome do seu repositório ECR
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-ec2:
    name: Deploy automatizado na EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Conectar na EC2 e atualizar contêiner
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com # Altere a região
          ECR_REPOSITORY: devops-python-api
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: us-east-1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu # Altere para 'ec2-user' se usar Amazon Linux
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          script: |
            # Autentica o Docker da instância no ECR usando a IAM Role da EC2
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
            
            # Baixa a imagem correspondente ao commit
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            
            # Substitui o contêiner anterior
            docker stop devops-python-api || true
            docker rm devops-python-api || true
            
            # Inicia a aplicação atualizada
            docker run -d --name devops-python-api -p 8000:8000 $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            
            # Verifica se o contêiner está em execução
            sleep 5
            docker ps | grep devops-python-api
